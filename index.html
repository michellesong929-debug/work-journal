<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&display=swap');
@import url('https://spoqa.github.io/spoqa-han-sans/css/SpoqaHanSansNeo.css');

#wj-root {
  --paper: #FFFFFF;
  --paper-line: #D6D6D6;
  --ink: #000000;
  --ink-soft: #333333;
  --ink-faint: #9A9A9A;
  --stamp: #000000;
  --stamp-soft: #F0F0F0;
  --sage: #000000;
  --sage-soft: #FFFFFF;
  --brass: #000000;
  --brass-soft: #FFFFFF;
  --card: #FFFFFF;

  --urgent: #1D4ED8;
  --urgent-soft: #FFFFFF;
  --ongoing-p: #000000;
  --ongoing-p-soft: #FFFFFF;
  --waited: #9A9A9A;
  --waited-soft: #FFFFFF;

  font-family: 'Kanit', 'Spoqa Han Sans Neo', 'Malgun Gothic', 'Segoe UI', sans-serif;
  font-size: 13px;
  color: var(--ink);
  background: var(--paper);
  min-height: 100%;
  padding: 0;
  box-sizing: border-box;
}
#wj-root *, #wj-root *::before, #wj-root *::after { box-sizing: border-box; }
#wj-root input::placeholder,
#wj-root textarea::placeholder {
  font-family: 'Kanit', 'Consolas', sans-serif;
  color: var(--ink-faint);
}

.wj-mono { font-family: 'Kanit', 'Consolas', sans-serif; }
.wj-serif { font-family: 'Kanit', 'Spoqa Han Sans Neo', 'Malgun Gothic', serif; }
.wj-pixel { font-family: 'Kanit', 'Consolas', sans-serif; letter-spacing: 0.06em; text-transform: uppercase; }

.wj-shell {
  max-width: 880px;
  margin: 0 auto;
  padding: 0 0 60px;
  border-left: 1px solid var(--paper-line);
  border-right: 1px solid var(--paper-line);
}

.wj-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  border-bottom: 2px solid var(--ink);
  padding: 14px 20px 8px;
  margin-bottom: 0;
}
.wj-header h1 {
  font-family: 'Kanit', 'Consolas', sans-serif;
  font-weight: 400;
  font-size: 22px;
  letter-spacing: -0.01em;
  text-transform: uppercase;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 10px;
}
.wj-header .wj-sub {
  font-family: 'Kanit', 'Consolas', sans-serif;
  font-weight: 400;
  font-size: 22px;
  letter-spacing: -0.01em;
  text-transform: uppercase;
  color: var(--ink);
}

.wj-data-bar {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 0;
  font-size: 10.5px;
  color: var(--ink-faint);
  padding: 0 20px 10px;
  border-bottom: 1px solid var(--paper-line);
}
.wj-data-link {
  background: none;
  border: none;
  color: var(--ink);
  font-size: 10.5px;
  font-weight: 400;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  cursor: pointer;
  padding: 1px 2px;
  line-height: 1.3;
  font-family: 'Kanit', 'Consolas', sans-serif;
}
.wj-data-link:hover { text-decoration: underline; }
.wj-import-panel {
  background: var(--stamp-soft);
  border: 1px dashed var(--stamp);
  border-radius: 0;
  padding: 12px 14px;
  margin: 0 20px 10px;
}
.wj-import-panel textarea {
  font-family: 'Kanit', 'Consolas', sans-serif;
  font-size: 12px;
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--paper-line);
  border-radius: 0;
  background: #fff;
  color: var(--ink);
  resize: vertical;
}

.wj-tabs {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 0;
  margin-bottom: 0;
  border-bottom: 2px solid var(--ink);
  padding-right: 20px;
}
.wj-tabs-left {
  display: flex;
  gap: 0;
}
.wj-tab {
  font-family: 'Kanit', 'Consolas', sans-serif;
  font-weight: 400;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 10px 20px 11px;
  cursor: pointer;
  color: var(--ink-faint);
  background: none;
  border: none;
  border-right: 1px solid var(--paper-line);
  margin-bottom: -2px;
  transition: color .15s ease;
}
.wj-tab:hover { color: var(--ink-soft); }
.wj-tab.active {
  color: #fff;
  background: var(--ink);
}
.wj-tabs-month {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.wj-tabs-month:empty { display: none; }
.wj-tabs-month-abbr {
  font-family: 'Kanit', 'Consolas', sans-serif;
  font-weight: 400;
  font-size: 17px;
  letter-spacing: -0.01em;
  text-transform: uppercase;
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.wj-tabs-month-today {
  font-family: 'Kanit', 'Consolas', sans-serif;
  font-size: 11px;
  color: var(--ink-faint);
  text-transform: uppercase;
}

#wj-panel {
  padding: 0 20px;
}

.wj-card {
  background: var(--card);
  border: none;
  border-bottom: 1px solid var(--paper-line);
  border-radius: 0;
  padding: 20px 0 22px;
  margin-bottom: 0;
  box-shadow: none;
}

.wj-date-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 16px;
}
.wj-date-nav {
  display: flex;
  align-items: center;
  gap: 4px;
}
.wj-date-nav button:not(.wj-btn-ghost) {
  background: none; border: 1px solid var(--paper-line);
  border-radius: 0; width: 28px; height: 28px;
  font-size: 14px; cursor: pointer; color: var(--ink);
  display: inline-flex; align-items: center; justify-content: center; line-height: 1;
}
.wj-date-nav button:hover { background: var(--paper-line); }
.wj-date-box {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  border: 1px solid var(--paper-line);
  background: #fff;
  padding: 5px 14px;
}
.wj-date-box input[type=date] {
  font-family: 'Kanit', 'Consolas', sans-serif;
  font-size: 12px;
  width: 15px;
  padding: 0;
  border: none;
  background: transparent;
  color: transparent;
  flex-shrink: 0;
}
.wj-date-box input[type=date]::-webkit-datetime-edit { display: none; }
.wj-date-box input[type=date]::-webkit-calendar-picker-indicator {
  margin: 0;
  padding: 0;
}
.wj-date-overlay {
  font-family: 'Kanit', 'Consolas', sans-serif;
  font-size: 12px;
  letter-spacing: 0.03em;
  color: var(--ink);
  pointer-events: none;
  white-space: nowrap;
}
.wj-weekday-sat { color: #1D4ED8; }
.wj-weekday-sun { color: #DC2626; }
.wj-date-nav .wj-btn-ghost {
  height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  line-height: 1;
  padding: 0 14px;
  white-space: nowrap;
}
.wj-jump-today-icon {
  flex-shrink: 0;
  color: var(--ink);
}
.wj-date-banner .wj-date {
  font-family: 'Kanit', 'Consolas', sans-serif;
  font-size: 17px;
  font-weight: 400;
  letter-spacing: -0.01em;
  text-transform: uppercase;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.wj-month-icon {
  flex-shrink: 0;
  display: inline-block;
  filter: grayscale(1) contrast(1.1);
  font-size: 12px;
  line-height: 1;
}
.wj-date-banner .wj-weekday {
  font-family: 'Kanit', 'Consolas', sans-serif;
  font-size: 11px;
  color: var(--ink-faint);
  margin-left: 8px;
  text-transform: uppercase;
}

.wj-carry {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--stamp-soft);
  border: 1px solid var(--ink);
  border-radius: 0;
  padding: 9px 14px;
  font-size: 12px;
  color: var(--ink);
  margin-bottom: 16px;
}
.wj-carry button {
  font-family: 'Kanit', 'Consolas', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: var(--ink);
  background: #fff;
  border: 1px solid var(--ink);
  border-radius: 0;
  padding: 4px 10px;
  cursor: pointer;
}
.wj-carry button:hover { background: var(--ink); color: #fff; }

.wj-add-row {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}
.wj-add-row input[type=text] {
  flex: 1;
  font-family: 'Kanit', 'Spoqa Han Sans Neo', 'Malgun Gothic', sans-serif;
  font-size: 14px;
  padding: 9px 12px;
  border: 1px solid var(--paper-line);
  border-radius: 0;
  background: #fff;
  color: var(--ink);
}
.wj-add-row input[type=text]:focus { outline: none; border-color: var(--ink-soft); }
.wj-btn-primary {
  font-family: 'Kanit', 'Consolas', sans-serif;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #fff;
  background: var(--ink);
  border: 1px solid var(--ink);
  border-radius: 0;
  padding: 9px 16px;
  cursor: pointer;
  white-space: nowrap;
  box-shadow: none;
  transition: background .1s ease;
}
.wj-btn-primary:hover { background: #333; }
.wj-btn-primary:active { transform: none; }
.wj-btn-primary.wj-btn-sm {
  font-size: 10.5px;
  padding: 6px 12px;
  border-width: 1px;
  box-shadow: none;
}
.wj-btn-primary.wj-btn-sm:active { box-shadow: none; }

.wj-task {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 9px 2px;
  border-bottom: 1px solid var(--paper-line);
}
.wj-task:last-child { border-bottom: none; }

.wj-period-section { margin-bottom: 6px; }
.wj-period-section:last-child { margin-bottom: 0; }
.wj-period-heading {
  font-family: 'Kanit', 'Consolas', sans-serif;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.1em;
  color: #fff;
  background: var(--ink);
  padding: 3px 8px;
  margin: 14px 0 4px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.wj-period-heading-icon {
  flex-shrink: 0;
  display: inline-flex;
  color: #fff;
}
.wj-period-section:first-child .wj-period-heading { margin-top: 4px; }
.wj-period-toggle {
  display: flex;
  border: 1px solid var(--ink);
  overflow: hidden;
  flex-shrink: 0;
}
.wj-period-toggle-btn {
  font-family: 'Kanit', 'Consolas', sans-serif;
  font-weight: 600;
  font-size: 10.5px;
  padding: 0 16px;
  min-width: 44px;
  height: 100%;
  border: none;
  background: #fff;
  color: var(--ink);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
}
.wj-period-toggle-icon { flex-shrink: 0; }
.wj-period-toggle-btn + .wj-period-toggle-btn { border-left: 1px solid var(--ink); }
.wj-period-toggle-btn.active { background: var(--stamp); color: #fff; }
.wj-period-chip {
  font-family: 'Kanit', 'Consolas', sans-serif;
  font-weight: 600;
  font-size: 10.5px;
  color: var(--ink);
  background: #fff;
  border: 1px solid var(--ink);
  padding: 1px 6px;
  cursor: pointer;
}
.wj-move-btn {
  font-size: 10px;
  color: var(--ink);
  background: #fff;
  border: 1px solid var(--paper-line);
  cursor: pointer;
  padding: 1px 4px;
  line-height: 1.4;
}
.wj-move-btn:hover:not(:disabled) { background: var(--paper-line); }
.wj-move-btn:disabled { color: var(--paper-line); cursor: default; }
.wj-check {
  flex-shrink: 0;
  width: 16px; height: 16px;
  border: 1.5px solid var(--ink);
  border-radius: 0;
  margin-top: 3px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  background: #fff;
  position: relative;
}
.wj-check.done { background: var(--ink); border-color: var(--ink); }
.wj-check.done::after {
  content: '';
  position: absolute;
  left: 3px; top: 7px;
  width: 2px; height: 2px;
  background: #fff;
  box-shadow:
    2px 2px 0 0 #fff,
    4px 0px 0 0 #fff,
    6px -2px 0 0 #fff,
    8px -4px 0 0 #fff;
}
.wj-task-text {
  flex: 1;
  font-size: 13px;
  line-height: 1.55;
  padding-top: 1px;
}
.wj-task-text.done { text-decoration: line-through; color: var(--ink-faint); }
.wj-task-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
.wj-mini-link {
  font-family: 'Kanit', 'Consolas', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: var(--ink);
  background: #fff;
  border: 1px solid var(--ink);
  border-radius: 0;
  padding: 3px 8px;
  cursor: pointer;
}
.wj-mini-link:hover { background: var(--ink); color: #fff; }
.wj-del {
  font-size: 12px;
  color: var(--ink-faint);
  background: none;
  border: none;
  cursor: pointer;
  width: 20px; height: 20px;
  border-radius: 0;
  display: inline-flex; align-items: center; justify-content: center;
}
.wj-del:hover { color: #fff; background: var(--ink); }
.wj-edit-btn {
  font-size: 11px;
  color: var(--ink-faint);
  background: none;
  border: none;
  cursor: pointer;
  width: 20px; height: 20px;
  border-radius: 0;
  display: inline-flex; align-items: center; justify-content: center;
}
.wj-edit-btn:hover { color: #fff; background: var(--ink); }
.wj-edit-input {
  flex: 1;
  font-family: 'Kanit', 'Spoqa Han Sans Neo', 'Malgun Gothic', sans-serif;
  font-size: 13px;
  padding: 5px 8px;
  border: 1.5px solid var(--ink);
  border-radius: 0;
  background: #fff;
  color: var(--ink);
  margin-top: -2px;
}
.wj-edit-input:focus { outline: none; }

/* Pending / ongoing tasks */
.wj-pending-card { margin-top: 4px; }
.wj-pending-header {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 4px;
}
.wj-pending-header h2 {
  font-family: 'Kanit', 'Consolas', sans-serif;
  font-weight: 400;
  font-size: 16px;
  text-transform: uppercase;
  letter-spacing: -0.01em;
  margin: 0;
}
.wj-pending-sub {
  font-family: 'Kanit', 'Consolas', sans-serif;
  font-size: 11px;
  color: var(--ink-faint);
  margin-bottom: 14px;
  line-height: 1.6;
}
.wj-priority-chip {
  flex-shrink: 0;
  font-family: 'Kanit', 'Consolas', sans-serif;
  font-size: 9.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 3px 7px;
  border-radius: 0;
  border: 1px solid var(--ink);
  cursor: pointer;
  white-space: nowrap;
}
.wj-priority-chip.urgent { background: var(--urgent-soft); color: var(--urgent); }
.wj-priority-chip.ongoing { background: var(--ongoing-p-soft); color: var(--ongoing-p); }
.wj-priority-chip.waited { background: var(--waited-soft); color: var(--waited); border-color: var(--ink-faint); }
.wj-priority-dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 0;
  margin-right: 5px;
}
.wj-priority-dot.urgent { background: var(--urgent); }
.wj-priority-dot.ongoing { background: var(--ongoing-p); }
.wj-priority-dot.waited { background: var(--waited); }
.wj-pending-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 9px 2px;
  border-bottom: 1px solid var(--paper-line);
}
.wj-pending-item:last-child { border-bottom: none; }

/* Monthly calendar (Today tab) */
.wj-calendar-card { padding-bottom: 14px; }
.wj-cal-toggle-row {
  display: flex;
  justify-content: flex-start;
  margin-bottom: 10px;
}
.wj-cal-toggle-wrap { display: inline-flex; }
.wj-cal-toggle-btn {
  font-family: 'Kanit', 'Consolas', sans-serif;
  font-weight: 700;
  font-size: 12px;
  color: var(--ink);
  background: var(--card);
  border: 1px solid var(--ink);
  border-radius: 0;
  width: 30px;
  height: 30px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.wj-cal-toggle-btn:hover { background: var(--paper-line); }
.wj-cal-toggle-btn.open { background: var(--ink); color: #fff; border-color: var(--ink); }
.wj-cal-popover {
  margin: 12px 0 4px;
  padding-bottom: 14px;
}
.wj-cal-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin-bottom: 14px;
}
.wj-cal-nav button {
  background: none; border: 1px solid var(--paper-line);
  border-radius: 0; width: 28px; height: 28px;
  font-size: 13px; cursor: pointer; color: var(--ink);
  display: inline-flex; align-items: center; justify-content: center; line-height: 1;
}
.wj-cal-nav button:hover { background: var(--paper-line); }
.wj-cal-month-label {
  font-family: 'Kanit', 'Consolas', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  min-width: 120px;
  text-align: center;
}
.wj-cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 1px;
  background: var(--paper-line);
  border: 1px solid var(--paper-line);
}
.wj-cal-head.sat { color: #1D4ED8; }
.wj-cal-head.sun { color: #DC2626; }
.wj-cal-head {
  text-align: center;
  font-family: 'Kanit', 'Consolas', sans-serif;
  font-size: 10px;
  font-weight: 700;
  color: var(--ink-faint);
  padding-bottom: 4px;
  background: var(--paper);
}
.wj-cal-cell {
  position: relative;
  min-height: 74px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: flex-start;
  border: none;
  border-radius: 0;
  background: #fff;
  cursor: pointer;
  padding: 4px 5px;
  text-align: left;
}
.wj-cal-cell.empty { cursor: default; background: var(--paper-line); }
.wj-cal-cell:not(.empty):hover { background: var(--stamp-soft); }
.wj-cal-daynum {
  font-family: 'Kanit', 'Consolas', sans-serif;
  font-size: 10px;
  color: var(--ink-faint);
  align-self: flex-start;
  margin-bottom: 2px;
}
.wj-cal-daynum.sat { color: #1D4ED8; }
.wj-cal-daynum.sun { color: #DC2626; }
.wj-cal-cell.today { box-shadow: inset 0 0 0 1.5px var(--ink); }
.wj-cal-cell.today .wj-cal-daynum { color: var(--stamp); font-weight: 700; }
.wj-cal-cell.today .wj-cal-daynum.sat { color: #1D4ED8; }
.wj-cal-cell.today .wj-cal-daynum.sun { color: #DC2626; }
.wj-cal-cell.selected { background: var(--ink); }
.wj-cal-cell.selected .wj-cal-daynum { color: #fff; font-weight: 700; }
.wj-cal-cell.selected .wj-cal-daynum.sat { color: #60A5FA; }
.wj-cal-cell.selected .wj-cal-daynum.sun { color: #F87171; }
.wj-cal-tasks {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 1px;
  overflow: hidden;
}
.wj-cal-task {
  font-family: 'Kanit', 'Consolas', sans-serif;
  font-size: 9.5px;
  line-height: 1.3;
  color: var(--ink-soft);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  width: 100%;
}
.wj-cal-task.done { color: var(--ink-faint); text-decoration: line-through; }
.wj-cal-cell.selected .wj-cal-task { color: #DDDDDD; }
.wj-cal-cell.selected .wj-cal-task.done { color: #888888; }
.wj-cal-more {
  font-family: 'Kanit', 'Consolas', sans-serif;
  font-size: 9px;
  color: var(--ink-faint);
  font-weight: 700;
}
.wj-cal-cell.selected .wj-cal-more { color: #BBBBBB; }

.wj-empty {
  font-family: 'Kanit', 'Consolas', sans-serif;
  font-size: 13px;
  color: var(--ink-faint);
  padding: 18px 4px;
  text-align: center;
}

/* Log form */
.wj-form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 12px;
}
.wj-field { display: flex; flex-direction: column; gap: 5px; }
.wj-field.full { grid-column: 1 / -1; }
.wj-field label {
  font-family: 'Kanit', 'Consolas', sans-serif;
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--ink-faint);
  letter-spacing: 0.04em;
}
.wj-field input, .wj-field textarea {
  font-family: 'Kanit', 'Spoqa Han Sans Neo', 'Malgun Gothic', sans-serif;

        <rect x="1" y="1" width="2" height="2" fill="#000"/>
        <rect x="5" y="1" width="2" height="2" fill="#000"/>
        <rect x="3" y="3" width="2" height="2" fill="#000"/>
        <rect x="1" y="4" width="2" height="2" fill="#000"/>
        <rect x="5" y="4" width="2" height="2" fill="#000"/>
        <rect x="3" y="6" width="2" height="2" fill="#000"/>
      </svg>Work Journal</h1>
      <div class="wj-sub" id="wj-today-stamp"></div>
    </div>
    <div class="wj-sub" id="wj-save-status" style="text-align:right;padding:2px 20px 0;margin:0;min-height:12px;font-size:10px;"></div>

      <div class="wj-field full">
        <label>Paste exported JSON here</label>
        <textarea id="wj-import-text" rows="4" placeholder='{"daily":{...},"logs":[...],"pending":[...]}'></textarea>
      </div>
      <div class="wj-inline-form-actions">

        <button class="wj-tab active" data-tab="today">Task</button>
        <button class="wj-tab" data-tab="log">Archive</button>

<script>
(function(){
  const KEY = 'journal-data';
  const CATS = ['LG U+ Revenue Verification', 'AP Payments', 'FX Revaluation', 'Audit Response', 'IFRS Documentation', 'Automation/Kiro', 'Other'];
  const PRIORITY_ORDER = ['urgent', 'ongoing', 'waited'];
  const PRIORITY_LABEL = { urgent: 'Urgent', ongoing: 'Ongoing', waited: 'Can wait' };
  let store = { daily: {}, logs: [], pending: [], scribble: '' };
  let scribbleSaveTimer = null;
  let activeTab = 'today';
  let pendingLogFromTask = null; // {date, text, source}
  let editingTaskId = null;
  let editingPendingId = null;
  let expandedLogIds = new Set();
  let selectedDate = null; // 'YYYY-MM-DD' for the Today tab
  let calendarMonth = null; // 'YYYY-MM' for the Today tab's calendar
  let calendarOpen = false;
  let newTaskPeriod = 'AM';

  const root = document.getElementById('wj-root');
  const panel = document.getElementById('wj-panel');
  const tabs = document.querySelectorAll('.wj-tab');

  function pad(n){ return String(n).padStart(2,'0'); }
  function todayStr(){
    const d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  }
  function offsetDateStr(dateStr, offset){
    const d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + offset);
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  }
  function weekdayKR(dateStr){
    const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const d = new Date(dateStr + 'T00:00:00');
    return days[d.getDay()];
  }
  function monthOf(dateStr){ return dateStr.slice(0,7); }
  const MONTH_ICONS = ['❄️','💌','🌱','🌷','🌸','☀️','🍉','👙','🍂','🎃','🍁','🎄'];
  function monthIcon(dateStr){
    const mo = parseInt(dateStr.slice(5,7), 10);
    return MONTH_ICONS[mo - 1];
  }
  function monthAbbr(dateStr){
    const abbrs = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    const mo = parseInt(dateStr.slice(5,7), 10);
    return abbrs[mo - 1];
  }
  function formatDateDisplay(dateStr){
    return dateStr.replace(/-/g, '.') + ' ' + weekdayKR(dateStr).toUpperCase();
  }
  function formatDateDisplayHtml(dateStr){
    const dow = new Date(dateStr + 'T00:00:00').getDay();
    const cls = dow === 0 ? 'wj-weekday-sun' : dow === 6 ? 'wj-weekday-sat' : '';
    const weekday = weekdayKR(dateStr).toUpperCase();
    const datePart = dateStr.replace(/-/g, '.');
    return `<span class="${cls}">${datePart}</span> <span class="${cls}">${weekday}</span>`;
  }
  function monthLabel(m){
    const [y,mo] = m.split('-');
    const months=['January','February','March','April','May','June','July','August','September','October','November','December']; return months[parseInt(mo,10)-1] + ' ' + y;
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function buildCalendarHtml(calMonth, selDate){
    const [y, m] = calMonth.split('-').map(Number);
    const firstWeekday = new Date(y, m - 1, 1).getDay();
    const daysInMonth = new Date(y, m, 0).getDate();
    const todayS = todayStr();
    const weekdayHeaders = ['S','M','T','W','T','F','S']
      .map((w, i) => `<div class="wj-cal-head ${i === 0 ? 'sun' : ''} ${i === 6 ? 'sat' : ''}">${w}</div>`).join('');
    const MAX_PREVIEW = 3;
    let cells = '';
    for (let i = 0; i < firstWeekday; i++) cells += `<div class="wj-cal-cell empty"></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = calMonth + '-' + pad(d);
      const dow = new Date(dateStr + 'T00:00:00').getDay();
      const dayTasks = store.daily[dateStr] || [];
      const isToday = dateStr === todayS;
      const isSelected = dateStr === selDate;
      const shown = dayTasks.slice(0, MAX_PREVIEW);
      const more = dayTasks.length - shown.length;
      const taskLines = shown.map(task =>
        `<div class="wj-cal-task ${task.done ? 'done' : ''}">${escapeHtml(task.text)}</div>`
      ).join('');
      const moreLine = more > 0 ? `<div class="wj-cal-more">+${more} more</div>` : '';
      cells += `<button class="wj-cal-cell ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}" data-cal-date="${dateStr}">
        <span class="wj-cal-daynum ${dow === 0 ? 'sun' : ''} ${dow === 6 ? 'sat' : ''}">${d}</span>
        <div class="wj-cal-tasks">${taskLines}${moreLine}</div>
      </button>`;
    }
    return `<div class="wj-cal-grid">${weekdayHeaders}${cells}</div>`;
  }
  function escapeHtml(s){
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function load(){
    try {
      const res = await window.storage.get(KEY);
      if (res && res.value) {
        store = JSON.parse(res.value);
        if (!store.daily) store.daily = {};
        if (!store.logs) store.logs = [];
        if (!store.pending) store.pending = [];
        if (typeof store.scribble !== 'string') store.scribble = '';
      }
      setSaveStatus('ok');
    } catch(e) {
      // A thrown error here can also just mean "key not found yet" (first-ever use),
      // which is normal and not a failure — only flag it if storage itself is missing.
      if (!window.storage || typeof window.storage.get !== 'function') {
        setSaveStatus('unavailable');
      } else {
        setSaveStatus('ok');
      }
    }
  }
  async function save(){
    try {
      const result = await window.storage.set(KEY, JSON.stringify(store));
      setSaveStatus(result ? 'ok' : 'error');
    } catch(e) {
      console.error('Save failed', e);
      setSaveStatus('error');
    }
  }
  function setSaveStatus(status){
    const el = document.getElementById('wj-save-status');
    if (!el) return;
    if (status === 'ok') {
      el.textContent = 'Saved';
      el.style.color = 'var(--ink-faint)';
    } else if (status === 'unavailable') {
      el.textContent = '⚠ Storage unavailable — publish this artifact (top of the artifact panel) to enable saving, then reopen it from the published link.';
      el.style.color = 'var(--urgent)';
    } else {
      el.textContent = '⚠ Save failed — your last change may not have been saved.';
      el.style.color = 'var(--urgent)';
    }
  }

  function setTab(t){
    activeTab = t;
    tabs.forEach(b => b.classList.toggle('active', b.dataset.tab === t));
    render();
  }

  async function exportData(){
    const json = JSON.stringify(store);
    try {
      await navigator.clipboard.writeText(json);
      const btn = document.getElementById('wj-export-btn');
      const original = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = original; }, 1800);
    } catch(e) {
      // Clipboard may be blocked — fall back to showing it in the import textarea for manual copy
      document.getElementById('wj-import-panel').style.display = 'block';
      document.getElementById('wj-import-text').value = json;
      document.getElementById('wj-import-text').select();
    }
  }

  function toggleImportPanel(show){
    const panel = document.getElementById('wj-import-panel');
    panel.style.display = show ? 'block' : 'none';
    const note = document.getElementById('wj-import-note');
    note.style.display = 'none';
    importArmed = false;
    const btn = document.getElementById('wj-import-confirm');
    if (btn) btn.textContent = 'Replace my data with this';
    if (show) document.getElementById('wj-import-text').focus();
  }

  let importArmed = false;
  async function confirmImport(){
    const raw = document.getElementById('wj-import-text').value.trim();
    const note = document.getElementById('wj-import-note');
    const btn = document.getElementById('wj-import-confirm');
    if (!raw) return;
    let parsed;
    try {
      parsed = JSON.parse(raw);
    } catch(e) {
      note.textContent = '⚠ That doesn\'t look like valid exported data — check the paste and try again.';
      note.style.color = 'var(--urgent)';
      note.style.display = 'block';
      importArmed = false;
      btn.textContent = 'Replace my data with this';
      return;
    }
    if (!importArmed) {
      importArmed = true;
      btn.textContent = 'Click again to confirm — this replaces everything';
      note.textContent = 'This will overwrite everything currently in this journal. Click the button once more to proceed, or Cancel to back out.';
      note.style.color = 'var(--urgent)';
      note.style.display = 'block';
      return;
    }
    store = {
      daily: parsed.daily || {},
      logs: parsed.logs || [],
      pending: parsed.pending || [],
      scribble: typeof parsed.scribble === 'string' ? parsed.scribble : ''
    };
    await save();
    importArmed = false;
    btn.textContent = 'Replace my data with this';
    toggleImportPanel(false);
    document.getElementById('wj-import-text').value = '';
    selectedDate = null;
    calendarMonth = null;
    render();
  }

  document.getElementById('wj-export-btn').addEventListener('click', exportData);
  document.getElementById('wj-import-btn').addEventListener('click', () => toggleImportPanel(true));
  document.getElementById('wj-import-cancel').addEventListener('click', () => {
    importArmed = false;
    document.getElementById('wj-import-confirm').textContent = 'Replace my data with this';
    toggleImportPanel(false);
  });
  document.getElementById('wj-import-confirm').addEventListener('click', confirmImport);
  tabs.forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));

  function render(){
    if (activeTab === 'today') renderToday();
    else if (activeTab === 'scribble') renderScribble();
    else renderLog();
  }

  // ---------- TODAY ----------
  function renderToday(){
    if (!selectedDate) selectedDate = todayStr();
    if (!calendarMonth) calendarMonth = monthOf(selectedDate);
    const t = selectedDate;
    const isRealToday = t === todayStr();
    const yest = offsetDateStr(t, -1);
    const tasks = store.daily[t] || [];
    const yestTasks = (store.daily[yest] || []).filter(x => !x.done);

    const calendarHtml = buildCalendarHtml(calendarMonth, t);

    let carryHtml = '';
    if (yestTasks.length > 0) {
      carryHtml = `<div class="wj-carry">
        <span>There ${yestTasks.length === 1 ? 'is' : 'are'} ${yestTasks.length} unfinished item(s) from ${yest}.</span>
        <button id="wj-carry-btn">Bring to this day</button>
      </div>`;
    }

    function renderTaskRow(task, siblingList) {
      let inlineForm = '';
      if (pendingLogFromTask && pendingLogFromTask.id === task.id) {
        inlineForm = renderInlineLogForm(task);
      }
      const isEditing = editingTaskId === task.id;
      const textCell = isEditing
        ? `<input type="text" class="wj-edit-input" id="wj-edit-input-${task.id}" value="${escapeHtml(task.text)}" data-edit-id="${task.id}" />`
        : `<div class="wj-task-text ${task.done?'done':''}">${escapeHtml(task.text)}</div>`;
      const idxInSibling = siblingList.findIndex(x => x.id === task.id);
      const isFirst = idxInSibling === 0;
      const isLast = idxInSibling === siblingList.length - 1;
      const actionButtons = isEditing
        ? `<button class="wj-mini-link" data-save-edit="${task.id}">Save</button>
           <button class="wj-btn-ghost" data-cancel-edit="${task.id}">Cancel</button>`
        : `${task.done ? `<button class="wj-mini-link" data-add-log="${task.id}">Add to Archive</button>` : ''}
           <button class="wj-period-chip" data-toggle-period="${task.id}" title="Switch AM/PM">${task.period || 'AM'}</button>
           <button class="wj-move-btn" data-move-up="${task.id}" ${isFirst ? 'disabled' : ''}>▲</button>
           <button class="wj-move-btn" data-move-down="${task.id}" ${isLast ? 'disabled' : ''}>▼</button>
           <button class="wj-edit-btn" data-edit="${task.id}">✎</button>
           <button class="wj-del" data-del="${task.id}">✕</button>`;
      return `<div class="wj-task">
          <div class="wj-check ${task.done?'done':''}" data-id="${task.id}"></div>
          ${textCell}
          <div class="wj-task-actions">
            ${actionButtons}
          </div>
        </div>
        ${inlineForm}`;
    }

    const amTasks = tasks.filter(x => (x.period || 'AM') === 'AM');
    const pmTasks = tasks.filter(x => (x.period || 'AM') === 'PM');

    let taskRows = '';
    if (tasks.length === 0) {
      taskRows = `<div class="wj-empty">No tasks yet. Add one above.</div>`;
    } else {
      taskRows = `
        <div class="wj-period-section">
          <div class="wj-period-heading"><svg class="wj-period-heading-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 1.5V4.5M12 19.5V22.5M22.5 12H19.5M4.5 12H1.5M19.36 4.64L17.24 6.76M6.76 17.24L4.64 19.36M19.36 19.36L17.24 17.24M6.76 6.76L4.64 4.64" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>AM</div>
          ${amTasks.length ? amTasks.map(t2 => renderTaskRow(t2, amTasks)).join('') : `<div class="wj-empty">Nothing in the morning.</div>`}
        </div>
        <div class="wj-period-section">
          <div class="wj-period-heading"><svg class="wj-period-heading-icon" width="11" height="11" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M20.5 14.5C19.3 15.05 17.95 15.35 16.55 15.35C11.4 15.35 7.2 11.15 7.2 6C7.2 4.6 7.5 3.25 8.05 2.05C4.4 3.35 1.8 6.85 1.8 11C1.8 16.3 6.1 20.6 11.4 20.6C15.55 20.6 19.05 18 20.5 14.5Z"/></svg>PM</div>
          ${pmTasks.length ? pmTasks.map(t2 => renderTaskRow(t2, pmTasks)).join('') : `<div class="wj-empty">Nothing in the afternoon.</div>`}
        </div>
      `;
    }

    let pendingRows = '';
    const sortedPending = store.pending.slice().sort((a,b) => {
      const rankDiff = PRIORITY_ORDER.indexOf(a.priority) - PRIORITY_ORDER.indexOf(b.priority);
      if (rankDiff !== 0) return rankDiff;
      return a.createdAt - b.createdAt;
    });
    if (sortedPending.length === 0) {
      pendingRows = `<div class="wj-empty">Nothing pending. Add an ongoing item below.</div>`;
    } else {
      pendingRows = sortedPending.map(item => {
        let inlineForm = '';
        if (pendingLogFromTask && pendingLogFromTask.id === item.id) {
          inlineForm = renderInlineLogForm(item);
        }
        const isEditing = editingPendingId === item.id;
        const textCell = isEditing
          ? `<input type="text" class="wj-edit-input" id="wj-pending-edit-input-${item.id}" value="${escapeHtml(item.text)}" data-edit-id="${item.id}" />`
          : `<div class="wj-task-text ${item.done?'done':''}">${escapeHtml(item.text)}</div>`;
        const actionButtons = isEditing
          ? `<button class="wj-mini-link" data-save-pending-edit="${item.id}">Save</button>
             <button class="wj-btn-ghost" data-cancel-pending-edit="${item.id}">Cancel</button>`
          : `${item.done ? `<button class="wj-mini-link" data-add-log="${item.id}">Add to Archive</button>` : ''}
             <button class="wj-edit-btn" data-edit-pending="${item.id}">✎</button>
             <button class="wj-del" data-del-pending="${item.id}">✕</button>`;
        return `<div class="wj-pending-item">
            <button class="wj-priority-chip ${item.priority}" data-cycle-priority="${item.id}" title="Click to change priority">${PRIORITY_LABEL[item.priority]}</button>
            <div class="wj-check ${item.done?'done':''}" data-pending-id="${item.id}"></div>
            ${textCell}
            <div class="wj-task-actions">
              ${actionButtons}
            </div>
          </div>
          ${inlineForm}`;
      }).join('');
    }

    const tabsMonthEl = document.getElementById('wj-tabs-month');
    if (tabsMonthEl) {
      tabsMonthEl.innerHTML = `<span class="wj-tabs-month-abbr"><span class="wj-month-icon">${monthIcon(t)}</span>${monthAbbr(t)}</span>${isRealToday ? '<span class="wj-tabs-month-today"> · Today</span>' : ''}`;
    }

    panel.innerHTML = `
      <div class="wj-card">
        <div class="wj-date-banner">
          <div class="wj-date-nav">
            <button class="wj-cal-toggle-btn ${calendarOpen ? 'open' : ''}" id="wj-cal-toggle" title="Toggle calendar">C</button>
            <button id="wj-prev-day">‹</button>
            <div class="wj-date-box">
              <span class="wj-date-overlay">${formatDateDisplayHtml(t)}</span>
              <input type="date" id="wj-date-picker" value="${t}" />
            </div>
            <button id="wj-next-day">›</button>
            ${!isRealToday ? `<button class="wj-btn-ghost" id="wj-jump-today">
              <svg class="wj-jump-today-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="14.5" cy="4" r="2" fill="currentColor"/>
                <path d="M12.5 8L9 9.5L7 14M9 9.5L11.5 12L11 17L14 21M11.5 12L15.5 11L18 14.5M9 9.5L6 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M14 21L17 19" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M7 14L4 15.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span>Jump to Today</span>
            </button>` : ''}
          </div>
        </div>
        ${calendarOpen ? `<div class="wj-cal-popover">
          <div class="wj-cal-nav">
            <button id="wj-cal-prev-month">‹</button>
            <div class="wj-cal-month-label">${monthLabel(calendarMonth)}</div>
            <button id="wj-cal-next-month">›</button>
          </div>
          ${calendarHtml}
        </div>` : ''}
        ${carryHtml}
        <div class="wj-add-row">
          <div class="wj-period-toggle">
            <button class="wj-period-toggle-btn ${newTaskPeriod === 'AM' ? 'active' : ''}" id="wj-period-am-btn"><svg class="wj-period-toggle-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 1.5V4.5M12 19.5V22.5M22.5 12H19.5M4.5 12H1.5M19.36 4.64L17.24 6.76M6.76 17.24L4.64 19.36M19.36 19.36L17.24 17.24M6.76 6.76L4.64 4.64" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>AM</button>
            <button class="wj-period-toggle-btn ${newTaskPeriod === 'PM' ? 'active' : ''}" id="wj-period-pm-btn"><svg class="wj-period-toggle-icon" width="11" height="11" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M20.5 14.5C19.3 15.05 17.95 15.35 16.55 15.35C11.4 15.35 7.2 11.15 7.2 6C7.2 4.6 7.5 3.25 8.05 2.05C4.4 3.35 1.8 6.85 1.8 11C1.8 16.3 6.1 20.6 11.4 20.6C15.55 20.6 19.05 18 20.5 14.5Z"/></svg>PM</button>
          </div>
          <input type="text" id="wj-new-task" placeholder="Enter a task for this day" />
          <button class="wj-btn-primary wj-btn-sm" id="wj-add-task-btn">Add</button>
        </div>
        ${taskRows}
      </div>
      <div class="wj-card wj-pending-card">
        <div class="wj-pending-header"><h2>Pending / Ongoing</h2></div>
        <div class="wj-pending-sub">Items without a fixed date. Tap the label to change priority — <span style="color:var(--urgent);font-weight:700;">Urgent</span>, <span style="color:var(--ongoing-p);font-weight:700;">Ongoing</span>, <span style="color:var(--waited);font-weight:700;">Can wait</span>.</div>
        <div class="wj-add-row">
          <input type="text" id="wj-new-pending" placeholder="Add an ongoing item" />
          <button class="wj-btn-primary wj-btn-sm" id="wj-add-pending-btn">Add</button>
        </div>
        ${pendingRows}
      </div>
    `;

    document.getElementById('wj-cal-toggle').addEventListener('click', () => { calendarOpen = !calendarOpen; renderToday(); });
    const calPrevBtn = document.getElementById('wj-cal-prev-month');
    if (calPrevBtn) calPrevBtn.addEventListener('click', () => { calendarMonth = shiftMonth(calendarMonth, -1); renderToday(); });
    const calNextBtn = document.getElementById('wj-cal-next-month');
    if (calNextBtn) calNextBtn.addEventListener('click', () => { calendarMonth = shiftMonth(calendarMonth, 1); renderToday(); });
    panel.querySelectorAll('[data-cal-date]').forEach(el => {
      el.addEventListener('click', () => { selectedDate = el.dataset.calDate; calendarMonth = monthOf(selectedDate); renderToday(); });
    });

    document.getElementById('wj-add-task-btn').addEventListener('click', addTask);
    document.getElementById('wj-new-task').addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
    document.getElementById('wj-period-am-btn').addEventListener('click', () => { newTaskPeriod = 'AM'; renderToday(); });
    document.getElementById('wj-period-pm-btn').addEventListener('click', () => { newTaskPeriod = 'PM'; renderToday(); });
    const carryBtn = document.getElementById('wj-carry-btn');
    if (carryBtn) carryBtn.addEventListener('click', carryOver);
    document.getElementById('wj-prev-day').addEventListener('click', () => { selectedDate = offsetDateStr(selectedDate, -1); calendarMonth = monthOf(selectedDate); renderToday(); });
    document.getElementById('wj-next-day').addEventListener('click', () => { selectedDate = offsetDateStr(selectedDate, 1); calendarMonth = monthOf(selectedDate); renderToday(); });
    document.getElementById('wj-date-picker').addEventListener('change', e => { if (e.target.value) { selectedDate = e.target.value; calendarMonth = monthOf(selectedDate); renderToday(); } });
    const jumpBtn = document.getElementById('wj-jump-today');
    if (jumpBtn) jumpBtn.addEventListener('click', () => { selectedDate = todayStr(); calendarMonth = monthOf(selectedDate); renderToday(); });

    document.getElementById('wj-add-pending-btn').addEventListener('click', addPending);
    document.getElementById('wj-new-pending').addEventListener('keydown', e => { if (e.key === 'Enter') addPending(); });

    panel.querySelectorAll('.wj-check[data-id]').forEach(el => {
      el.addEventListener('click', () => toggleTask(el.dataset.id));
    });
    panel.querySelectorAll('[data-move-up]').forEach(el => {
      el.addEventListener('click', () => moveTask(el.dataset.moveUp, -1));
    });
    panel.querySelectorAll('[data-move-down]').forEach(el => {
      el.addEventListener('click', () => moveTask(el.dataset.moveDown, 1));
    });
    panel.querySelectorAll('[data-toggle-period]').forEach(el => {
      el.addEventListener('click', () => togglePeriod(el.dataset.togglePeriod));
    });
    panel.querySelectorAll('[data-del]').forEach(el => {
      el.addEventListener('click', () => deleteTask(el.dataset.del));
    });
    panel.querySelectorAll('[data-edit]').forEach(el => {
      el.addEventListener('click', () => {
        editingTaskId = el.dataset.edit;
        renderToday();
        const input = document.getElementById('wj-edit-input-' + editingTaskId);
        if (input) { input.focus(); input.select(); }
      });
    });
    panel.querySelectorAll('[data-save-edit]').forEach(el => {
      el.addEventListener('click', () => saveTaskEdit(el.dataset.saveEdit));
    });
    panel.querySelectorAll('[data-cancel-edit]').forEach(el => {
      el.addEventListener('click', () => { editingTaskId = null; renderToday(); });
    });
    panel.querySelectorAll('.wj-edit-input').forEach(el => {
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          if (el.id.startsWith('wj-pending-edit-input-')) savePendingEdit(el.dataset.editId);
          else saveTaskEdit(el.dataset.editId);
        }
        if (e.key === 'Escape') { editingTaskId = null; editingPendingId = null; renderToday(); }
      });
    });

    panel.querySelectorAll('.wj-check[data-pending-id]').forEach(el => {
      el.addEventListener('click', () => togglePending(el.dataset.pendingId));
    });
    panel.querySelectorAll('[data-cycle-priority]').forEach(el => {
      el.addEventListener('click', () => cyclePriority(el.dataset.cyclePriority));
    });
    panel.querySelectorAll('[data-edit-pending]').forEach(el => {
      el.addEventListener('click', () => {
        editingPendingId = el.dataset.editPending;
        renderToday();
        const input = document.getElementById('wj-pending-edit-input-' + editingPendingId);
        if (input) { input.focus(); input.select(); }
      });
    });
    panel.querySelectorAll('[data-save-pending-edit]').forEach(el => {
      el.addEventListener('click', () => savePendingEdit(el.dataset.savePendingEdit));
    });
    panel.querySelectorAll('[data-cancel-pending-edit]').forEach(el => {
      el.addEventListener('click', () => { editingPendingId = null; renderToday(); });
    });
    panel.querySelectorAll('[data-del-pending]').forEach(el => {
      el.addEventListener('click', () => deletePending(el.dataset.delPending));
    });

    panel.querySelectorAll('[data-add-log]').forEach(el => {
      el.addEventListener('click', () => {
        const id = el.dataset.addLog;
        const fromDaily = tasks.find(x => x.id === id);
        const fromPending = store.pending.find(x => x.id === id);
        const src = fromDaily || fromPending;
        const logDate = fromDaily ? t : todayStr();
        pendingLogFromTask = pendingLogFromTask && pendingLogFromTask.id === id ? null : { id, date: logDate, text: src.text };
        renderToday();
      });
    });
    bindInlineLogForm();
  }

  function renderInlineLogForm(task){
    return `<div class="wj-inline-form" data-inline-form="${task.id}">
      <div class="wj-form-grid">
        <div class="wj-field">
          <label>Category</label>
          <input type="text" list="wj-cat-list" id="wj-inline-cat" value="" placeholder="e.g. LG U+ Revenue Verification" />
        </div>
        <div class="wj-field">
          <label>Collaborators (comma-separated)</label>
          <input type="text" id="wj-inline-collab" placeholder="e.g. J. Kim (Manager), IT Team" />
        </div>
        <div class="wj-field full">
          <label>Details (optional)</label>
          <textarea id="wj-inline-desc" rows="2" placeholder="Add any extra notes here"></textarea>
        </div>
      </div>
      <div class="wj-inline-form-actions">
        <button class="wj-btn-ghost" id="wj-inline-cancel">Cancel</button>
        <button class="wj-btn-primary" id="wj-inline-save">Save entry</button>
      </div>
      <datalist id="wj-cat-list">
        ${CATS.map(c => `<option value="${c}"></option>`).join('')}
      </datalist>
    </div>`;
  }

  function bindInlineLogForm(){
    const cancel = document.getElementById('wj-inline-cancel');
    const saveBtn = document.getElementById('wj-inline-save');
    if (cancel) cancel.addEventListener('click', () => { pendingLogFromTask = null; renderToday(); });
    if (saveBtn) saveBtn.addEventListener('click', () => {
      const cat = document.getElementById('wj-inline-cat').value.trim() || 'Other';
      const collab = document.getElementById('wj-inline-collab').value.trim();
      const desc = document.getElementById('wj-inline-desc').value.trim();
      store.logs.unshift({
        id: uid(),
        date: pendingLogFromTask.date,
        title: pendingLogFromTask.text,
        category: cat,
        collaborators: collab,
        description: desc,
        createdAt: Date.now()
      });
      pendingLogFromTask = null;
      save();
      renderToday();
    });
  }

  function addTask(){
    const input = document.getElementById('wj-new-task');
    const text = input.value.trim();
    if (!text) return;
    const t = selectedDate;
    if (!store.daily[t]) store.daily[t] = [];
    store.daily[t].push({ id: uid(), text, done: false, period: newTaskPeriod });
    input.value = '';
    save();
    renderToday();
  }
  function toggleTask(id){
    const t = selectedDate;
    const list = store.daily[t] || [];
    const item = list.find(x => x.id === id);
    if (item) item.done = !item.done;
    save();
    renderToday();
  }
  function saveTaskEdit(id){
    const input = document.getElementById('wj-edit-input-' + id);
    const newText = input ? input.value.trim() : '';
    if (!newText) return;
    const t = selectedDate;
    const item = (store.daily[t] || []).find(x => x.id === id);
    if (item) item.text = newText;
    editingTaskId = null;
    save();
    renderToday();
  }
  function deleteTask(id){
    const t = selectedDate;
    store.daily[t] = (store.daily[t]||[]).filter(x => x.id !== id);
    if (pendingLogFromTask && pendingLogFromTask.id === id) pendingLogFromTask = null;
    if (editingTaskId === id) editingTaskId = null;
    save();
    renderToday();
  }
  function moveTask(id, direction){
    const t = selectedDate;
    const list = store.daily[t] || [];
    const idx = list.findIndex(x => x.id === id);
    if (idx === -1) return;
    const period = list[idx].period || 'AM';
    let swapIdx = idx + direction;
    while (swapIdx >= 0 && swapIdx < list.length && (list[swapIdx].period || 'AM') !== period) {
      swapIdx += direction;
    }
    if (swapIdx < 0 || swapIdx >= list.length) return;
    [list[idx], list[swapIdx]] = [list[swapIdx], list[idx]];
    save();
    renderToday();
  }
  function togglePeriod(id){
    const t = selectedDate;
    const list = store.daily[t] || [];
    const item = list.find(x => x.id === id);
    if (!item) return;
    item.period = (item.period || 'AM') === 'AM' ? 'PM' : 'AM';
    save();
    renderToday();
  }
  function carryOver(){
    const t = selectedDate;
    const yest = offsetDateStr(t, -1);
    const yestUndone = (store.daily[yest]||[]).filter(x => !x.done);
    if (!store.daily[t]) store.daily[t] = [];
    yestUndone.forEach(task => {
      store.daily[t].push({ id: uid(), text: task.text, done: false, period: task.period || 'AM' });
    });
    save();
    renderToday();
  }

  function addPending(){
    const input = document.getElementById('wj-new-pending');
    const text = input.value.trim();
    if (!text) return;
    store.pending.push({ id: uid(), text, priority: 'ongoing', done: false, createdAt: Date.now() });
    input.value = '';
    save();
    renderToday();
  }
  function togglePending(id){
    const item = store.pending.find(x => x.id === id);
    if (item) item.done = !item.done;
    save();
    renderToday();
  }
  function savePendingEdit(id){
    const input = document.getElementById('wj-pending-edit-input-' + id);
    const newText = input ? input.value.trim() : '';
    if (!newText) return;
    const item = store.pending.find(x => x.id === id);
    if (item) item.text = newText;
    editingPendingId = null;
    save();
    renderToday();
  }
  function deletePending(id){
    store.pending = store.pending.filter(x => x.id !== id);
    if (pendingLogFromTask && pendingLogFromTask.id === id) pendingLogFromTask = null;
    if (editingPendingId === id) editingPendingId = null;
    save();
    renderToday();
  }
  function cyclePriority(id){
    const item = store.pending.find(x => x.id === id);
    if (!item) return;
    const idx = PRIORITY_ORDER.indexOf(item.priority);
    item.priority = PRIORITY_ORDER[(idx + 1) % PRIORITY_ORDER.length];
    save();
    renderToday();
  }

  // ---------- SCRIBBLE ----------
  function renderScribble(){
    const tabsMonthEl = document.getElementById('wj-tabs-month');
    if (tabsMonthEl) tabsMonthEl.innerHTML = '';
    panel.innerHTML = `
      <div class="wj-card">
        <div class="wj-section-label">Scribble</div>
        <textarea id="wj-scribble-text" class="wj-scribble-textarea" placeholder="Jot down anything — random notes, ideas, reminders...">${escapeHtml(store.scribble || '')}</textarea>
      </div>
    `;
    const ta = document.getElementById('wj-scribble-text');
    ta.addEventListener('input', () => {
      store.scribble = ta.value;
      clearTimeout(scribbleSaveTimer);
      scribbleSaveTimer = setTimeout(() => save(), 500);
    });
    ta.addEventListener('blur', () => {
      store.scribble = ta.value;
      clearTimeout(scribbleSaveTimer);
      save();
    });
  }

  // ---------- LOG ----------
  function renderLog(){
    const tabsMonthEl = document.getElementById('wj-tabs-month');
    if (tabsMonthEl) tabsMonthEl.innerHTML = '';
    const entries = store.logs.slice().sort((a,b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);

    const byCat = {};
    entries.forEach(e => {
      const cat = e.category || 'Other';
      if (!byCat[cat]) byCat[cat] = [];
      byCat[cat].push(e);
    });
    const catNames = Object.keys(byCat).sort((a,b) => byCat[b].length - byCat[a].length || a.localeCompare(b));

    let galleryHtml = '';
    if (entries.length === 0) {
      galleryHtml = `<div class="wj-empty">No entries logged yet. Add your first one below.</div>`;
    } else {
      galleryHtml = catNames.map(cat => {
        const cards = byCat[cat].map(e => {
          const collabTags = (e.collaborators || '').split(',').map(s=>s.trim()).filter(Boolean)
            .map(c => `<span class="wj-collab-tag">${escapeHtml(c)}</span>`).join('');
          const isExpanded = expandedLogIds.has(e.id);
          const detailsToggle = e.description
            ? `<button class="wj-details-toggle" data-toggle-details="${e.id}">${isExpanded ? 'Hide details ▲' : 'Details ▼'}</button>`
            : '';
          const detailsBody = (e.description && isExpanded)
            ? `<div class="wj-entry-desc">${escapeHtml(e.description)}</div>` : '';
          return `<div class="wj-gallery-card">
            <button class="wj-entry-del" data-del-log="${e.id}">✕</button>
            <div class="wj-entry-date">${formatDateDisplayHtml(e.date)}</div>
            <div class="wj-entry-title">${escapeHtml(e.title)}</div>
            ${detailsToggle}
            ${detailsBody}
            ${collabTags ? `<div class="wj-collab-row">${collabTags}</div>` : ''}
          </div>`;
        }).join('');
        return `<div class="wj-log-category-section">
          <div class="wj-log-category-title">${escapeHtml(cat)}<span class="wj-log-category-count">${byCat[cat].length}</span></div>
          <div class="wj-gallery-grid">${cards}</div>
        </div>`;
      }).join('');
    }

    panel.innerHTML = `
      <div class="wj-card">
        <div class="wj-section-label">New archive entry</div>
        <div class="wj-form-grid">
          <div class="wj-field">
            <label>Date</label>
            <input type="date" id="wj-log-date" value="${todayStr()}" />
          </div>
          <div class="wj-field">
            <label>Category</label>
            <input type="text" list="wj-cat-list-2" id="wj-log-cat" placeholder="e.g. LG U+ Revenue Verification" />
          </div>
          <div class="wj-field full">
            <label>Title (one-line summary)</label>
            <input type="text" id="wj-log-title" placeholder="e.g. LG U+ July revenue reconciliation data check" />
          </div>
          <div class="wj-field full">
            <label>Details</label>
            <textarea id="wj-log-desc" rows="3" placeholder="Describe the work, any issues, and the outcome"></textarea>
          </div>
          <div class="wj-field full">
            <label>Collaborators (comma-separated)</label>
            <input type="text" id="wj-log-collab" placeholder="e.g. J. Kim (Manager), IT Team, HSBC contact" />
          </div>
        </div>
        <button class="wj-btn-primary" id="wj-log-save">Save entry</button>
        <datalist id="wj-cat-list-2">
          ${CATS.map(c => `<option value="${c}"></option>`).join('')}
        </datalist>
      </div>
      ${galleryHtml}
    `;

    document.getElementById('wj-log-save').addEventListener('click', saveLogEntry);
    panel.querySelectorAll('[data-del-log]').forEach(el => {
      el.addEventListener('click', () => deleteLogEntry(el.dataset.delLog));
    });
    panel.querySelectorAll('[data-toggle-details]').forEach(el => {
      el.addEventListener('click', () => {
        const id = el.dataset.toggleDetails;
        if (expandedLogIds.has(id)) expandedLogIds.delete(id);
        else expandedLogIds.add(id);
        renderLog();
      });
    });
  }

  function saveLogEntry(){
    const date = document.getElementById('wj-log-date').value || todayStr();
    const cat = document.getElementById('wj-log-cat').value.trim() || 'Other';
    const title = document.getElementById('wj-log-title').value.trim();
    const desc = document.getElementById('wj-log-desc').value.trim();
    const collab = document.getElementById('wj-log-collab').value.trim();
    if (!title) {
      document.getElementById('wj-log-title').focus();
      return;
    }
    store.logs.unshift({ id: uid(), date, category: cat, title, description: desc, collaborators: collab, createdAt: Date.now() });
    save();
    renderLog();
  }
  function deleteLogEntry(id){
    store.logs = store.logs.filter(x => x.id !== id);
    save();
    renderLog();
  }

  // ---------- MONTHLY ----------
  function shiftMonth(m, delta){
    const [y,mo] = m.split('-').map(Number);
    const d = new Date(y, mo-1+delta, 1);
    return d.getFullYear() + '-' + pad(d.getMonth()+1);
  }

  // ---------- INIT ----------
  function waitForStorage(timeoutMs){
    return new Promise(resolve => {
      const start = Date.now();
      (function poll(){
        if (window.storage && typeof window.storage.get === 'function') return resolve(true);
        if (Date.now() - start > timeoutMs) return resolve(false);
        setTimeout(poll, 60);
      })();
    });
  }
  (async function init(){
    document.getElementById('wj-today-stamp').textContent = todayStr().slice(0, 4);
    await waitForStorage(2000);
    await load();
    render();
  })();
})();
</script>
